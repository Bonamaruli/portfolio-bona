<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bona Maruli Panjaitan</title>
<meta name="description" content="Personal portfolio of Bona Maruli Panjaitan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Courier+Prime:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
/* Layout: fixed top nav over a living hexagon-circuit sky (echoing the LinkedIn banner); each menu item opens its own view with staggered entrances, like the reference but horizontal */
:root{
  --bg:#06173a;
  --bg-2:#0a2352;
  --surface:#0d2a5e;
  --surface-2:#11346f;
  --line:#1e4b8f;
  --ink:#eaf3ff;
  --muted:#9fb7da;
  --accent:#43bfff;     /* banner line blue */
  --accent-2:#9be3ff;   /* banner node highlight */
  --brand:#0a66c2;      /* LinkedIn blue */
  --ok:#3ddc97;
  --font-head:"Poppins", "Segoe UI", system-ui, sans-serif;
  --font-body:"Poppins", "Segoe UI", system-ui, sans-serif;
  --font-type:"Courier Prime", "Courier New", Courier, monospace;
  --r:16px;
  --nav-h:68px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:8px}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- Background ---------- */
#hex{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 50% -10%, rgb(67 191 255 / .16), transparent 70%),
    radial-gradient(700px 500px at 100% 100%, rgb(10 102 194 / .22), transparent 70%)}
#cursor-glow{position:fixed;z-index:-1;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgb(67 191 255 / .14), transparent 65%);transition:opacity .3s;opacity:0;left:0;top:0}

/* ---------- Nav ---------- */
.nav{position:fixed;z-index:50;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--nav-h);
  background:rgb(6 23 58 / .72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgb(67 191 255 / .18)}
.nav .wrap{height:100%;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer;background:none;border:0;padding:0}
.brand-hex{width:40px;height:40px;display:grid;place-items:center;font-weight:800;font-size:.9rem;color:#06173a;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);
  animation:hexspin 10s linear infinite}
@keyframes hexspin{0%,85%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.brand-text{line-height:1.15;text-align:left}
.brand-text b{display:block;font-size:.95rem;font-weight:700}
.brand-text span{font-size:.72rem;color:var(--accent)}
.menu{position:relative;display:flex;gap:2px;margin-left:auto;list-style:none;padding:0}
.menu button{background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;
  font-size:.84rem;font-weight:500;color:var(--muted);transition:color .25s;white-space:nowrap}
.menu button svg{opacity:.85}
.menu button:hover{color:var(--ink)}
.menu button.active{color:var(--ink)}
.menu .ind{position:absolute;bottom:-2px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:0 0 12px var(--accent);transition:left .45s cubic-bezier(.6,.05,.2,1), width .45s cubic-bezier(.6,.05,.2,1)}
.burger{display:none;margin-left:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;place-items:center}
.burger span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;position:relative;transition:transform .3s, background .3s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}
@media (max-width:1060px){
  .menu{display:none}
  .burger{display:grid}
  .menu.open{display:grid;position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--nav-h));left:0;right:0;margin:0;
    padding:10px max(16px, env(safe-area-inset-right,0px)) 16px max(16px, env(safe-area-inset-left,0px));
    background:rgb(6 23 58 / .96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;
    animation:drop .35s cubic-bezier(.2,.8,.2,1)}
  .menu.open button{padding:12px 14px;background:var(--surface);font-size:.9rem}
  .menu.open button.active{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
  .menu .ind{display:none}
}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}

/* ---------- Pages ---------- */
main{padding-top:calc(env(safe-area-inset-top,0px) + var(--nav-h) + 40px);padding-bottom:60px;min-height:100vh}
.page{animation:none}
.page.leave{animation:pageOut .25s ease forwards}
@keyframes pageOut{to{opacity:0;transform:translateY(-14px);filter:blur(4px)}}
.page.play [data-anim]{animation:var(--anim,up) .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 70ms)}
[data-anim="left"]{--anim:fromLeft}
[data-anim="right"]{--anim:fromRight}
[data-anim="zoom"]{--anim:zoomIn}
[data-anim="pop"]{--anim:popIn}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-40px)}}
@keyframes fromRight{from{opacity:0;transform:translateX(40px)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.88)}}
@keyframes popIn{0%{opacity:0;transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:none}}

/* Section title like the reference: accent bar + trailing line */
.sec-title{display:flex;align-items:center;gap:16px;margin:0 0 30px}
.sec-title h2{margin:0;font-family:var(--font-head);font-weight:700;font-size:clamp(1.6rem,3.4vw,2rem);padding-left:16px;border-left:4px solid var(--accent);line-height:1.2;white-space:nowrap}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* Shared card */
.card{position:relative;border-radius:var(--r);background:linear-gradient(160deg,rgb(17 52 111 / .75),rgb(10 35 82 / .75));
  border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s}
.card.glow::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%), rgb(67 191 255 / .16), transparent 60%)}
.card.glow:hover{border-color:rgb(67 191 255 / .6);box-shadow:0 20px 50px -20px rgb(67 191 255 / .45);transform:translateY(-6px)}
.card.glow:hover::before{opacity:1}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  padding:10px 18px;border-radius:10px;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .2s, border-color .2s, background .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--accent));border-color:transparent;color:#fff}
.btn.primary:hover{box-shadow:0 10px 24px -8px var(--accent)}
.btn.sm{padding:7px 13px;font-size:.8rem}
.ripple{position:absolute;border-radius:50%;background:rgb(255 255 255 / .45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.ph{display:grid;place-items:center;gap:6px;align-content:center;width:100%;height:100%;color:var(--muted);font-size:.78rem;text-align:center;
  background:repeating-linear-gradient(135deg,rgb(67 191 255 / .06) 0 12px,transparent 12px 24px),var(--bg-2)}
.ph svg{font-size:1.6rem;color:var(--accent)}

/* ---------- About / hero ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;margin-bottom:70px}
.hero > *{min-width:0}
.hero-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;margin:0 0 6px}
.hero-label svg{color:var(--accent)}
.hero h1{font-family:var(--font-head);font-weight:800;font-size:clamp(2.4rem,6.4vw,4.2rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
.hero h1 .nm{white-space:nowrap}
.hero h1 .l{display:inline-block;color:var(--accent);background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.page.play .hero h1 .l{animation:wave .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) * 45ms + 150ms)}
@keyframes wave{0%{opacity:0;transform:translateY(.6em) rotateX(80deg)}60%{transform:translateY(-.08em)}100%{opacity:1;transform:none}}
@keyframes sheen{to{background-position:-200% 0}}
.typer{font-family:var(--font-type);font-weight:700;font-size:clamp(1.15rem,2.6vw,1.6rem);letter-spacing:.04em;min-height:1.5em;margin:0 0 18px}
.typer .caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);margin-left:2px;vertical-align:-.15em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.quick{display:flex;gap:10px;margin-bottom:26px}
.quick a{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--accent);background:rgb(67 191 255 / .08);border:1px solid rgb(67 191 255 / .2);transition:transform .25s, background .25s}
.quick a:hover{transform:translateY(-4px) rotate(-6deg);background:rgb(67 191 255 / .2)}
.quick a::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,6px);white-space:nowrap;
  font-size:.72rem;padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--bg);opacity:0;pointer-events:none;transition:all .2s}
.quick a:hover::after{opacity:1;transform:translate(-50%,0)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:30px}
.stats div b{display:block;font-size:1.8rem;font-weight:800;line-height:1;color:var(--accent-2);font-variant-numeric:tabular-nums}
.stats div span{font-size:.8rem;color:var(--muted)}

.photo-frame{position:relative;width:min(380px,100%);aspect-ratio:4/3.2;margin-left:auto;animation:float 6s ease-in-out infinite}
.photo-frame::before{content:"";position:absolute;inset:-3px;border-radius:20px;
  background:conic-gradient(from var(--ang,0deg),var(--accent),transparent 30%,var(--brand),transparent 70%,var(--accent));
  animation:turn 4s linear infinite;filter:blur(.5px)}
.photo-frame::after{content:"";position:absolute;inset:-18px;border-radius:30px;background:radial-gradient(closest-side,rgb(67 191 255 / .35),transparent);z-index:-1}
.photo-frame .inner{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:var(--bg-2)}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes turn{to{--ang:360deg}}
@keyframes float{50%{transform:translateY(-12px)}}
.hex-badge{position:absolute;right:-14px;bottom:-14px;width:64px;height:64px;display:grid;place-items:center;color:#06173a;font-size:1.3rem;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);animation:hexspin 8s linear infinite}
@media (max-width:860px){.hero{grid-template-columns:1fr}.photo-frame{order:-1;margin:0 auto 10px;width:min(300px,100%)}}

.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:28px}
@media (max-width:860px){.about-grid{grid-template-columns:1fr}}
.profile-card{padding:34px 26px;text-align:center}
.profile-card::after{content:"";position:absolute;top:-80px;left:50%;width:320px;height:240px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgb(67 191 255 / .28),transparent);pointer-events:none}
.avatar{position:relative;z-index:1;width:124px;height:124px;margin:0 auto 14px;border-radius:50%;padding:4px;
  background:conic-gradient(from var(--ang,0deg),var(--accent),var(--brand),var(--accent-2),var(--accent));animation:turn 5s linear infinite}
.avatar .in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--bg-2);display:grid;place-items:center;font-weight:800;font-size:2.2rem;color:var(--accent-2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-card h3{position:relative;z-index:1;margin:0 0 8px;font-size:1.3rem;font-weight:700}
.avail{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ok);padding:4px 14px;border-radius:999px;border:1px solid rgb(61 220 151 / .4);background:rgb(61 220 151 / .08)}
.avail i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgb(61 220 151 / 0)}100%{box-shadow:0 0 0 0 rgb(61 220 151 / 0)}}
.info{position:relative;z-index:1;list-style:none;margin:26px 0 0;padding:22px 0 0;border-top:1px solid var(--line);display:grid;gap:18px;text-align:left}
.info li{display:flex;gap:14px;align-items:center;min-width:0}
.info .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgb(67 191 255 / .1);color:var(--accent);transition:transform .3s}
.info li:hover .ic{transform:rotate(-12deg) scale(1.1)}
.info small{display:block;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info b{display:block;font-size:.9rem;font-weight:600;overflow-wrap:anywhere}
.hello-card{padding:34px 34px 30px}
.qmark{position:absolute;top:18px;left:22px;font-size:3.4rem;color:rgb(67 191 255 / .28)}
.hello-card h3{position:relative;font-size:1.45rem;font-weight:700;margin:0 0 16px}
.hello-card h3 span{color:var(--accent)}
.hello-card p{position:relative;margin:0 0 12px;color:#d4e3f8;font-size:.92rem}
.connect{border-top:1px solid var(--line);margin-top:22px;padding-top:20px}
.connect h4{margin:0 0 14px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.soc{display:flex;flex-wrap:wrap;gap:12px}
.soc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--muted);color:var(--ink);transition:all .3s}
.soc a:hover{border-color:var(--accent);background:var(--accent);color:#06173a;transform:translateY(-4px) rotate(360deg)}

/* ---------- Education ---------- */
.edu-list{display:grid;gap:26px}
.edu{padding:0}
.edu-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:26px 28px}
.edu-ic{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;color:#06173a;background:linear-gradient(135deg,var(--accent-2),var(--accent));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.edu:hover .edu-ic{transform:rotate(-10deg) scale(1.08)}
.edu-main{flex:1;min-width:200px}
.edu-main h3{margin:0;font-size:1.25rem;font-weight:700}
.edu-main .sch{color:var(--accent);font-weight:600;margin:2px 0 6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;color:var(--muted);font-size:.82rem}
.meta span{display:inline-flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:.75rem;font-weight:600;background:rgb(61 220 151 / .1);color:var(--ok);border:1px solid rgb(61 220 151 / .35)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}

/* Main photo (auto slideshow, click to enlarge) */
.edu-cover{position:relative;aspect-ratio:16/8;max-width:100%;overflow:hidden;background:var(--bg-2);border-block:1px solid var(--line);cursor:zoom-in}
.edu-cover.empty{cursor:default}
.edu-cover .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.edu-cover .slide.on{opacity:1}
.edu-cover .slide img{width:100%;height:100%;object-fit:cover;display:block}
.edu-cover .slide.on img{animation:kenburns 6.5s ease-out both}
@keyframes kenburns{from{transform:scale(1.14) translate(1.5%,1%)}to{transform:scale(1.02)}}
.edu-cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 55%,rgb(6 23 58 / .7))}
.edu-cover > .ph{position:absolute;inset:0}
.edu-cover .zoom-hint{position:absolute;top:14px;right:14px;z-index:2;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:.75rem;font-weight:600;
  background:rgb(6 23 58 / .7);border:1px solid rgb(155 227 255 / .3);backdrop-filter:blur(6px);opacity:0;transform:translateY(-6px);transition:all .3s}
.edu-cover:hover .zoom-hint,.edu-cover:focus-visible .zoom-hint{opacity:1;transform:none}
.edu-cover .dots{position:absolute;left:0;right:0;bottom:14px;z-index:2;display:flex;justify-content:center;gap:6px;pointer-events:none}
.edu-cover .dots i{display:block;width:8px;height:8px;border-radius:999px;background:rgb(234 243 255 / .45);transition:width .4s, background .4s}
.edu-cover .dots i.on{width:24px;background:var(--accent)}

.edu-body{padding:24px 28px 28px;display:grid;gap:22px}
.edu-body > p{margin:0;color:#d4e3f8;font-size:.93rem;max-width:90ch}
.ach-box{padding:20px 22px;border-radius:14px;background:rgb(6 23 58 / .45);border:1px solid var(--line)}
.ach-box h4{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-size:1rem;font-weight:700}
.ach-box h4 svg{color:var(--accent)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.checks svg{color:var(--accent);margin-top:4px;flex:none}
.gal-block{border-top:1px solid var(--line);padding-top:22px}
.gal-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gal-title svg{color:var(--accent)}
.gal-title.big{font-size:1rem;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700;margin-bottom:14px}

/* Photo grid */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gallery.sm{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gallery button{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);padding:0;cursor:zoom-in;background:var(--bg-2);color:var(--ink);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .35s}
.gallery.sm button{aspect-ratio:4/3}
.gallery button:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 16px 32px -14px rgb(67 191 255 / .6)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.gallery button:hover img{transform:scale(1.12)}
.gallery button::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 40%,rgb(6 23 58 / .85));opacity:0;transition:opacity .35s}
.gallery button:hover::after{opacity:1}
.gallery .zi{position:absolute;z-index:1;left:0;right:0;bottom:10px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:.75rem;font-weight:600;
  opacity:0;transform:translateY(8px);transition:all .35s}
.gallery button:hover .zi{opacity:1;transform:none}
.gallery .more-tile{display:grid;place-items:center;border-style:dashed;background:rgb(67 191 255 / .07)}
.gallery .more-tile::after{display:none}
.gallery .more-tile b{display:block;font-size:1.5rem;font-weight:800;color:var(--accent-2);line-height:1.1}
.gallery .more-tile small{display:block;font-size:.72rem;color:var(--muted)}

    if (prev && !reduce) { prev.classList.add("leave"); setTimeout(enter, 230); } else enter();
  }
  function onEnter(id, el){
    clearTimeout(typerTimer);
    if (id === "about") { startTyper(); countUp(el); }
    if (id === "skills") setTimeout(() => $$(".lvl i", el).forEach(i => i.style.width = i.dataset.w + "%"), 300);
  }
  function startTyper(){
    const out = $("#typed"), roles = P.roles.filter(Boolean);
    if (!out || !roles.length) return;
    if (reduce) { out.textContent = roles[0]; return; }
    let r = 0, i = 0, del = false;
    (function step(){
      const w = roles[r]; out.textContent = w.slice(0, i);
      let t = del ? 40 : 90;
      if (!del && i === w.length) { del = true; t = 1500; }
      else if (del && i === 0) { del = false; r = (r + 1) % roles.length; t = 350; }
      i += del ? -1 : 1; if (i < 0) i = 0;
      typerTimer = setTimeout(step, t);
    })();
  }
  function countUp(el){
    if (reduce) return;
    $$("[data-count]", el).forEach(b => {
      const n = +b.dataset.count, t0 = performance.now();
      const tick = t => { const p = Math.min(1, (t - t0) / 1300); b.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  }

  /* ---------- Portfolio card photo slider ---------- */
  let swiped = false;
  function slideCard(th, d){
    if (!th) return;
    const n = +th.dataset.n; if (n < 2) return;
    const i = (((+th.dataset.idx || 0) + d) % n + n) % n;
    th.dataset.idx = i;
    const tr = $(".ptrack", th); if (tr) tr.style.transform = `translateX(${-100 * i}%)`;
    $$(".pdots i", th).forEach((dot, j) => dot.classList.toggle("on", j === i));
    const pc = $(".pc", th); if (pc) pc.textContent = i + 1;
  }
  let sw = null;
  document.addEventListener("pointerdown", e => {
    const th = e.target.closest(".proj .thumb[data-n]");
    sw = th && +th.dataset.n > 1 && !e.target.closest("button") ? { th, x: e.clientX } : null;
  });
  document.addEventListener("pointerup", e => {
    if (!sw) return;
    const dx = e.clientX - sw.x;
    if (Math.abs(dx) > 40) { slideCard(sw.th, dx < 0 ? 1 : -1); swiped = true; setTimeout(() => swiped = false, 350); }
    sw = null;
  });

  /* ---------- Global click handling ---------- */
  document.addEventListener("click", e => {
    const go = e.target.closest("[data-go]"); if (go) { show(go.dataset.go); return; }
    if (e.target.closest("#brand")) { show(C.menu[0].id); return; }
    const f = e.target.closest("[data-skill-filter]");
    if (f) {
      $$("[data-skill-filter]").forEach(c => c.classList.toggle("on", c === f));
      const v = f.dataset.skillFilter;
      $$(".skill").forEach((s, i) => {
        const on = v === "All" || s.dataset.cat === v;
        s.classList.toggle("hide", !on);
        if (on && !reduce) { s.style.animation = "none"; void s.offsetWidth; s.style.animation = `popIn .55s cubic-bezier(.2,.8,.2,1) ${i * 30}ms both`; }
      });
      return;
    }
    const pn = e.target.closest("[data-pnav]"); if (pn) { slideCard(pn.closest(".thumb"), +pn.dataset.pnav); return; }
    if (e.target.closest(".proj .over") && !e.target.closest("button")) {
      if (swiped) { swiped = false; return; }
      const th = e.target.closest(".thumb"); openLightbox(th.dataset.key, +th.dataset.idx || 0, th); return;
    }
    const g = e.target.closest("[data-gal]"); if (g) { openLightbox(g.dataset.gal, +g.dataset.idx, g); return; }
    const pj = e.target.closest("[data-proj]"); if (pj) { openProject(+pj.dataset.proj); return; }
    const ct = e.target.closest("[data-cert]"); if (ct) { openCert(+ct.dataset.cert); return; }
    const cp = e.target.closest("[data-copy]"); if (cp) { copy(cp.dataset.copy, cp); return; }
  });

  // Ripple on buttons
  document.addEventListener("pointerdown", e => {
    const b = e.target.closest(".btn"); if (!b || reduce) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), sp = document.createElement("span");
    sp.className = "ripple"; sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    b.appendChild(sp); setTimeout(() => sp.remove(), 650);
  });

  // Spotlight that follows the pointer on cards
  document.addEventListener("pointermove", e => {
    const c = e.target.closest(".card.glow"); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  // Cursor glow
  if (!reduce && matchMedia("(hover: hover)").matches) {
    const cg = $("#cursor-glow");
    addEventListener("pointermove", e => { cg.style.opacity = 1; cg.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; });
  }

  // Burger
  $("#burger").addEventListener("click", () => {
    const m = $("#menu"), open = !m.classList.contains("open");
    m.classList.toggle("open", open); $("#burger").setAttribute("aria-expanded", open);
  });
  addEventListener("resize", moveIndicator);

  /* ---------- Copy ---------- */
  function copy(text, btn){
    const old = btn.innerHTML;
    const done = msg => { btn.innerHTML = msg; setTimeout(() => btn.innerHTML = old, 1500); };
    try { navigator.clipboard.writeText(text).then(() => done(`${ic("fa-solid fa-check")} Copied`), () => done("Copy gagal")); }
    catch (e) { done("Copy gagal"); }
  }

  /* ---------- Modals ---------- */
  const mroot = $("#modal-root");
  let lastFocus = null;
  function openModal(html){
    lastFocus = document.activeElement;
    mroot.innerHTML = `<div class="modal" id="modal" role="dialog" aria-modal="true">${html}</div>`;
    const m = $("#modal");
    m.addEventListener("click", e => { if (e.target === m || e.target.closest(".x")) closeModal(); });
    const x = $(".x", m); if (x) x.focus();
    document.body.style.overflow = "hidden";
  }
  function closeModal(){ mroot.innerHTML = ""; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
  addEventListener("keydown", e => {
    if ($("#lbx")) {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") stepLightbox(1);
      if (e.key === "ArrowLeft") stepLightbox(-1);
      return;
    }
    const cv = e.target.closest && e.target.closest(".edu-cover[data-gal]");
    if (cv && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); cv.click(); return; }
    if ($("#modal") && e.key === "Escape") closeModal();
  });
  const X = `<button class="x" type="button" aria-label="Close">${ic("fa-solid fa-xmark")}</button>`;
  function openProject(k){
    const p = C.portfolio[k];
    const photos = [p.image, ...(p.gallery || [])].filter(Boolean);
    galleries["proj" + k] = { photos, title: p.title, sub: "Portfolio" };
    openModal(`<div class="modal-box">${X}<div class="m-img" data-gal="proj${k}" data-idx="0" style="cursor:zoom-in">${img(p.image, p.title)}</div><div class="m-body">
      <h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
      <ul class="tags">${p.tags.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      ${photos.length > 1 ? `<h4 class="gal-title">${ic("fa-regular fa-images")} Gallery</h4>${galleryHTML(photos, "proj" + k, 4, "sm")}` : ""}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${p.demo ? `<a class="btn primary" href="${esc(p.demo)}"${ext(p.demo)}>${ic("fa-solid fa-arrow-up-right-from-square")} Live Demo</a>` : ""}
        ${p.code ? `<a class="btn" href="${esc(p.code)}"${ext(p.code)}>${ic("fa-brands fa-github")} Source Code</a>` : ""}
      </div></div></div>`);
  }
  function openCert(k){
    const c = C.achievements[k];
    openModal(`<div class="modal-box">${X}<div class="m-img">${img(c.image, c.title)}</div><div class="m-body">
      <h3>${esc(c.title)}</h3>
      <div class="meta"><span>${ic("fa-solid fa-building-columns")}${esc(c.issuer)}</span><span>${ic("fa-regular fa-calendar")}${esc(c.date)}</span></div>
      ${c.description ? `<p>${esc(c.description)}</p>` : ""}
      ${c.link ? `<a class="btn primary" style="justify-self:start" href="${esc(c.link)}"${ext(c.link)}>${ic("fa-solid fa-certificate")} Lihat Kredensial</a>` : ""}
      </div></div>`);
  }
  /* ---------- Full-screen photo viewer ---------- */
  let LB = null;
  const slideInner = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}">` : `<div class="ph">${ic("fa-regular fa-image")}Tambahkan foto di CONFIG</div>`;
  function flip(view, from, reverse){
    if (reduce || !from || !document.body.contains(from) || !view.animate) return;
    const a = from.getBoundingClientRect(), b = view.getBoundingClientRect();
    if (!a.width || !b.width) return;
    const sc = Math.max(a.width / b.width, a.height / b.height);
    const tf = `translate(${a.left + a.width / 2 - (b.left + b.width / 2)}px, ${a.top + a.height / 2 - (b.top + b.height / 2)}px) scale(${sc})`;
    const frames = [{ transform: tf, opacity: .3 }, { transform: "none", opacity: 1 }];
    view.animate(reverse ? frames.reverse() : frames, { duration: reverse ? 300 : 520, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both" });
  }
  function openLightbox(key, idx, fromEl){
    const g = galleries[key]; if (!g || !g.photos.length) return;
    if ($("#lbx")) $("#lbx").remove();
    const n = g.photos.length, multi = n > 1;
    LB = { g, idx: 0, fromEl, focus: document.activeElement };
    const el = document.createElement("div");
    el.className = "lbx"; el.id = "lbx";
    el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "Galeri foto");
    el.innerHTML = `
      <div class="lbx-top"><div><b>${esc(g.title)}</b><span>${esc(g.sub)}</span></div>
        <button class="lbx-btn lbx-x" type="button" aria-label="Tutup">${ic("fa-solid fa-xmark")}</button></div>
      <div class="lbx-stage">
        ${multi ? `<button class="lbx-btn lbx-nav lbx-prev" type="button" aria-label="Foto sebelumnya">${ic("fa-solid fa-chevron-left")}</button>` : ""}
        <div class="lbx-view"></div>
        ${multi ? `<button class="lbx-btn lbx-nav lbx-next" type="button" aria-label="Foto berikutnya">${ic("fa-solid fa-chevron-right")}</button>` : ""}
      </div>
      <div class="lbx-count" aria-live="polite"></div>
      ${multi ? `<div class="lbx-thumbs">${g.photos.map((src, i) => `<button type="button" data-lbx-go="${i}" aria-label="Foto ${i + 1}">${slideInner(src, "")}</button>`).join("")}</div>` : ""}`;
    document.body.appendChild(el);
    document.body.style.overflow = "hidden";
    setSlide(Math.min(Math.max(idx, 0), n - 1), 0);
    flip($(".lbx-view", el), fromEl, false);
    $(".lbx-x", el).focus();

    el.addEventListener("click", e => {
      if (e.target.closest(".lbx-x")) return closeLightbox();
      if (e.target.closest(".lbx-prev")) return stepLightbox(-1);
      if (e.target.closest(".lbx-next")) return stepLightbox(1);
      const t = e.target.closest("[data-lbx-go]");
      if (t) { const i = +t.dataset.lbxGo; if (i !== LB.idx) setSlide(i, i > LB.idx ? 1 : -1); return; }
      if (e.target === el || e.target.classList.contains("lbx-slide") || e.target.classList.contains("lbx-stage")) closeLightbox();
    });
    // swipe on phones
    let sx = null;
    const view = $(".lbx-view", el);
    view.addEventListener("pointerdown", e => { sx = e.clientX; });
    view.addEventListener("pointerup", e => {
      if (sx === null) return; const dx = e.clientX - sx; sx = null;
      if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1);
    });
  }
  function setSlide(i, dir){
    const el = $("#lbx"); if (!el || !LB) return;
    const list = LB.g.photos, n = list.length; i = (i + n) % n;
    const view = $(".lbx-view", el);
    const old = view.querySelector(".lbx-slide:not(.leaving)");
    const fig = document.createElement("figure");
    fig.className = "lbx-slide" + (dir && !reduce ? (dir > 0 ? " in-next" : " in-prev") : "");
    fig.innerHTML = slideInner(list[i], `${LB.g.title} — foto ${i + 1}`);
    view.appendChild(fig);
    if (old) {
      if (dir && !reduce) {
        old.classList.add("leaving", dir > 0 ? "out-next" : "out-prev");
        setTimeout(() => old.remove(), 460);
      } else old.remove();
    }
    LB.idx = i;
    $(".lbx-count", el).textContent = `${i + 1} / ${n}`;
    const th = $(".lbx-thumbs", el);
    if (th) {
      $$("button", th).forEach((b, j) => b.classList.toggle("on", j === i));
      const b = th.children[i];
      th.scrollTo({ left: b.offsetLeft - th.clientWidth / 2 + b.offsetWidth / 2, behavior: reduce ? "auto" : "smooth" });
    }
  }
  function stepLightbox(d){ if (LB && LB.g.photos.length > 1) setSlide(LB.idx + d, d); }
  function closeLightbox(){
    const el = $("#lbx"); if (!el) return;
    const back = LB && LB.focus;
    document.body.style.overflow = "";
    if (reduce) { el.remove(); } else {
      el.classList.add("closing");
      flip($(".lbx-view", el), LB && LB.fromEl, true);
      setTimeout(() => el.remove(), 300);
    }
    LB = null;
    if (back && back.focus) back.focus();
  }

  /* ---------- Education main photo: auto slideshow ---------- */
  function goCover(cv, i){
    $$(".slide", cv).forEach((s, j) => s.classList.toggle("on", j === i));
    $$(".dots i", cv).forEach((d, j) => d.classList.toggle("on", j === i));
    cv.dataset.idx = i;
  }
  setInterval(() => {
    if (document.hidden || $("#lbx") || reduce) return;
    $$(".page:not([hidden]) .edu-cover[data-n]").forEach(cv => {
      const n = +cv.dataset.n; if (n < 2 || cv.matches(":hover")) return;
      goCover(cv, ((+cv.dataset.idx || 0) + 1) % n);
    });
  }, 4500);

  /* ---------- Clear message when a photo path is wrong ---------- */
  document.addEventListener("error", e => {
    const t = e.target;
    if (!t || t.tagName !== "IMG" || t.dataset.failed) return;
    t.dataset.failed = "1";
    const d = document.createElement("div");
    d.className = "ph missing";
    d.innerHTML = `${ic("fa-solid fa-triangle-exclamation")}<span>Foto tidak ditemukan</span><code>${esc(t.getAttribute("src"))}</code>`;
    t.replaceWith(d);
  }, true);

  /* ---------- Contact form: opens the visitor's email app with the message ---------- */
  const form = $("#msg-form");
  if (form) form.addEventListener("submit", e => {
    e.preventDefault();
    const n = $("#f-name").value.trim(), em = $("#f-email").value.trim(), s = $("#f-subject").value.trim(), m = $("#f-msg").value.trim();
    const note = $("#form-note");
    if (!n || !em || !m) { note.textContent = "Please fill in your name, email and message."; return; }
    const body = `${m}\n\n— ${n} (${em})`;
    location.href = `mailto:${P.email}?subject=${encodeURIComponent(s || "Hello from your portfolio")}&body=${encodeURIComponent(body)}`;
    note.textContent = `Opening your email app… If nothing happens, email me directly at ${P.email}.`;
  });

  /* ---------- Hexagon circuit background (like the LinkedIn banner) ---------- */
  (function(){
    const cv = $("#hex"), ctx = cv.getContext("2d");
    let W, H, dpr, edges = [], nodes = [], pulses = [], mouse = { x: -999, y: -999 }, raf;
    function build(){
      dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      edges = []; nodes = []; pulses = [];
      const s = Math.max(34, Math.min(56, W / 26)), hw = Math.sqrt(3) * s, vh = 1.5 * s;
      const seen = new Set();
      const key = (x, y) => Math.round(x) + "," + Math.round(y);
      for (let row = -1; row * vh < H + s; row++) {
        for (let col = -1; col * hw < W + hw; col++) {
          const cx = col * hw + (row % 2 ? hw / 2 : 0), cy = row * vh;
          const edgeDist = Math.min(cx, W - cx) / W;                 // 0 at sides, .5 in the middle
          const density = W < 700 ? .32 : Math.max(.05, .75 - edgeDist * 2.4);
          if (Math.random() > density) continue;
          const pts = [];
          for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); pts.push([cx + s * Math.cos(a), cy + s * Math.sin(a)]); }
          for (let k = 0; k < 6; k++) {
            if (Math.random() < .22) continue;                     // broken edges like circuit lines
            const a = pts[k], b = pts[(k + 1) % 6], id = [key(...a), key(...b)].sort().join("|");
            if (seen.has(id)) continue; seen.add(id);
            edges.push({ a, b, alpha: .12 + Math.random() * .28 * (1 - edgeDist) });
            if (Math.random() < .3) nodes.push({ x: a[0], y: a[1], r: 2 + Math.random() * 2.4, big: Math.random() < .25, ph: Math.random() * 6.28 });
          }
        }
      }
      for (let i = 0; i < Math.min(22, edges.length / 6); i++) pulses.push(newPulse());
    }
    const newPulse = () => ({ e: edges[(Math.random() * edges.length) | 0], t: Math.random(), v: .006 + Math.random() * .012 });
    function frame(time){
      ctx.clearRect(0, 0, W, H);
      ctx.lineWidth = 1.4;
      for (const e of edges) {
        const mx = (e.a[0] + e.b[0]) / 2, my = (e.a[1] + e.b[1]) / 2, d = Math.hypot(mx - mouse.x, my - mouse.y);
        const boost = d < 180 ? (1 - d / 180) * .6 : 0;
        ctx.strokeStyle = `rgba(67,191,255,${Math.min(.9, e.alpha + boost)})`;
        ctx.beginPath(); ctx.moveTo(e.a[0], e.a[1]); ctx.lineTo(e.b[0], e.b[1]); ctx.stroke();
      }
      for (const n of nodes) {
        const tw = reduce ? 1 : .65 + .35 * Math.sin(time / 900 + n.ph);
        const d = Math.hypot(n.x - mouse.x, n.y - mouse.y), near = d < 160 ? 1 - d / 160 : 0;
        ctx.fillStyle = n.big ? `rgba(200,240,255,${.75 * tw + near * .25})` : `rgba(67,191,255,${.6 * tw + near * .4})`;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + near * 2.5, 0, 6.283); ctx.fill();
        if (n.big && !reduce) { ctx.strokeStyle = `rgba(155,227,255,${.25 * tw})`; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5 + 3 * tw, 0, 6.283); ctx.stroke(); }
      }
      if (!reduce) {
        for (const p of pulses) {
          p.t += p.v; if (p.t > 1) Object.assign(p, newPulse(), { t: 0 });
          const x = p.e.a[0] + (p.e.b[0] - p.e.a[0]) * p.t, y = p.e.a[1] + (p.e.b[1] - p.e.a[1]) * p.t;
          const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
          g.addColorStop(0, "rgba(220,247,255,.95)"); g.addColorStop(1, "rgba(67,191,255,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.283); ctx.fill();
        }
        raf = requestAnimationFrame(frame);
      }
    }
    build(); frame(0);
    let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { cancelAnimationFrame(raf); build(); frame(performance.now()); }, 150); });
    addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(raf); else if (!reduce) raf = requestAnimationFrame(frame); });
  })();

  /* ---------- Start ---------- */
  const start = (location.hash || "").slice(1);
  show(C.menu.some(m => m.id === start) ? start : C.menu[0].id, false);
  addEventListener("hashchange", () => show(location.hash.slice(1), false));
  addEventListener("load", () => { try { scrollTo({ top: 0, behavior: "instant" }); } catch (e) { scrollTo(0, 0); } });
  // Font Awesome swaps icons after load; re-measure the indicator then
  setTimeout(moveIndicator, 400); setTimeout(moveIndicator, 1200);
})();
</script>
</body>
